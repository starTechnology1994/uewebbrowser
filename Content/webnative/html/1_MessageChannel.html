<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Channel Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #e0e0e0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    user-select: none;
    -webkit-user-select: none;
  }
input,textarea{user-select:text;-webkit-user-select:text;}

  /* 面板 */
  .panel {
    width: 360px;
    max-width: 50vw;
    height: 100vh;
    background: rgba(20, 22, 28, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .panel-left  { border-right: 1px solid rgba(255,255,255,0.06); }
  .panel-right { border-left:  1px solid rgba(255,255,255,0.06); }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .panel-header h2 {
    font-size: 15px;
    font-weight: 600;
    background: linear-gradient(135deg, #5c6bc0, #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .panel-right .panel-header h2 {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    -webkit-background-clip: text;
  }
  .panel-header .subtitle {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    margin-top: 2px;
  }
  .panel-header .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: 2px;
  }
  .badge-send { background: rgba(92,107,192,0.25); color: #8c9eff; }
  .badge-recv { background: rgba(67,160,71,0.25); color: #81c784; }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
  }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

  /* 表单 */
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 4px;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 8px 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 13px;
    font-family: "SF Mono", "Consolas", "Monaco", monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: rgba(100, 180, 255, 0.45);
  }
  .form-group textarea {
    resize: vertical;
    min-height: 60px;
    font-size: 12px;
    line-height: 1.5;
  }

  /* 按钮 */
  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    color: #fff;
    font-weight: 500;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; transform: none; }

  .btn-send {
    background: linear-gradient(135deg, #5c6bc0, #7c4dff);
    width: 100%;
    margin-top: 4px;
  }
  .btn-recv {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    width: 100%;
    margin-top: 4px;
  }
  .btn-clear { background: rgba(255,255,255,0.08); }

  /* 统计卡片 */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .stat-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .stat-card .stat-value {
    font-size: 20px;
    font-weight: 700;
    font-family: "SF Mono", "Consolas", "Monaco", monospace;
    background: linear-gradient(135deg, #64b5f6, #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card.green .stat-value {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    -webkit-background-clip: text;
  }
  .stat-card .stat-label {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .stat-card.running .stat-value {
    -webkit-text-fill-color: #f9a825;
    background: none;
    color: #f9a825;
    animation: pulse 0.8s ease-in-out infinite;
  }
  .stat-card.done .stat-value {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    -webkit-background-clip: text;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* 进度条 */
  .progress-wrap {
    margin-top: 8px;
  }
  .progress-bar {
    width: 100%; height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #5c6bc0, #7c4dff);
    border-radius: 2px;
    transition: width 0.15s;
    width: 0%;
  }
  .progress-text {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    text-align: right;
  }

  /* 日志 */
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
    margin: 16px 0 6px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .log-area {
    overflow-y: auto;
    font-family: "SF Mono", "Consolas", "Monaco", monospace;
    font-size: 11px;
    line-height: 1.6;
    flex: 1;
  }
  .log-area::-webkit-scrollbar { width: 4px; }
  .log-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .log-item {
    padding: 3px 8px;
    border-radius: 3px;
    margin-bottom: 2px;
    border-left: 2px solid transparent;
  }
  .log-item.send { border-left-color: #5c6bc0; background: rgba(92,107,192,0.08); }
  .log-item.recv { border-left-color: #43a047; background: rgba(67,160,71,0.08); }
  .log-item.info { border-left-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.03); }

  .log-item .fn { color: #64b5f6; }
  .log-item .ts  { color: rgba(255,255,255,0.3); font-size: 10px; float: right; }

  /* 右侧面板 body 也用 flex-column 让日志撑满 */
  .panel-right .panel-body {
    display: flex;
    flex-direction: column;
  }

  /* 响应式 */
  @media (max-width: 800px) {
    body { flex-direction: column; }
    .panel { width: 100vw; max-width: 100vw; height: 50vh; }
    .panel-left  { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .panel-right { border-left:  none; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ===== 左侧面板：JS → UE ===== -->
<div class="panel panel-left">
  <div class="panel-header">
    <h2>JS → UE <span class="badge badge-send">发送</span></h2>
    <div class="subtitle">WebNative.send(FunctionName, MessageBody)</div>
  </div>
  <div class="panel-body">

    <div class="form-group">
      <label>Function Name 函数名</label>
      <input type="text" id="fnName" value="PerfTest" placeholder="e.g. PerfTest, Login, SaveData">
    </div>

    <div class="form-group">
      <label>Message Body 消息体 (JSON)</label>
      <textarea id="msgBody" placeholder='{"key": "value"}'>{"index": 0, "data": "hello from JS", "timestamp": 0}</textarea>
    </div>

    <div class="form-group">
      <label>Send Count 发送条数</label>
      <input type="number" id="sendCount" value="1000" min="1" max="100000" step="1">
    </div>

    <button class="btn btn-send" id="btnSend">Send to UE</button>

    <!-- 统计 -->
    <div class="stats" id="statsArea">
      <div class="stat-card" id="cardSent">
        <div class="stat-value">0</div>
        <div class="stat-label">Sent 已发送</div>
      </div>
      <div class="stat-card" id="cardElapsed">
        <div class="stat-value">0ms</div>
        <div class="stat-label">Elapsed 耗时</div>
      </div>
      <div class="stat-card" id="cardRate">
        <div class="stat-value">0</div>
        <div class="stat-label">Msg/s 速率</div>
      </div>
    </div>

    <!-- 进度 -->
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Ready</div>
    </div>
  </div>
</div>

<!-- ===== 右侧面板：UE → JS ===== -->
<div class="panel panel-right">
  <div class="panel-header">
    <h2>UE → JS <span class="badge badge-recv">接收</span></h2>
    <div class="subtitle">WebNative.on("FunctionName", callback)</div>
  </div>
  <div class="panel-body">

    <div class="form-group">
      <label>Function Name 函数名 (UE→JS)</label>
      <input type="text" id="recvFnName" value="UeTestMsg" placeholder="e.g. UeTestMsg, OnData, OnNotify">
    </div>

    <div class="form-group">
      <label>Message Body 消息体 (JSON 模板)</label>
      <textarea id="recvMsgBody" placeholder='{"key": "value"}'>{"index": 0, "data": "hello from UE", "timestamp": 0}</textarea>
    </div>

    <div class="form-group">
      <label>Send Count 发送条数</label>
      <input type="number" id="recvCount" value="1000" min="1" max="100000" step="1">
    </div>

    <button class="btn btn-recv" id="btnRecv">Send to JS</button>

    <!-- 统计 -->
    <div class="stats" id="recvStatsArea">
      <div class="stat-card green" id="cardRecvCount">
        <div class="stat-value">0</div>
        <div class="stat-label">Recv 已接收</div>
      </div>
      <div class="stat-card green" id="cardRecvElapsed">
        <div class="stat-value">0ms</div>
        <div class="stat-label">Elapsed 耗时</div>
      </div>
      <div class="stat-card green" id="cardRecvRate">
        <div class="stat-value">0</div>
        <div class="stat-label">Msg/s 速率</div>
      </div>
    </div>

    <div class="section-title">Receive Log 接收日志</div>
    <div class="log-area" id="ueLogArea"></div>
    <div style="margin-top:8px;">
      <button class="btn btn-clear" id="btnClearUe" style="font-size:11px;padding:4px 10px;">Clear</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ========== DOM 引用 ==========
  const fnNameEl     = document.getElementById('fnName');
  const msgBodyEl    = document.getElementById('msgBody');
  const sendCountEl  = document.getElementById('sendCount');
  const btnSend      = document.getElementById('btnSend');
  const btnClearUe   = document.getElementById('btnClearUe');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const ueLogArea    = document.getElementById('ueLogArea');
  const cardSent     = document.getElementById('cardSent');
  const cardElapsed  = document.getElementById('cardElapsed');
  const cardRate     = document.getElementById('cardRate');

  // 右侧：UE → JS
  const recvFnNameEl     = document.getElementById('recvFnName');
  const recvMsgBodyEl    = document.getElementById('recvMsgBody');
  const recvCountEl      = document.getElementById('recvCount');
  const btnRecv          = document.getElementById('btnRecv');
  const cardRecvCount    = document.getElementById('cardRecvCount');
  const cardRecvElapsed  = document.getElementById('cardRecvElapsed');
  const cardRecvRate     = document.getElementById('cardRecvRate');

  // ========== 状态 ==========
  let sending = false;
  let sendStartTime = 0;
  let sendEndTime = 0;
  let totalToSend = 0;
  let totalReceived = 0;

  // 右侧：UE → JS 接收状态
  let recvRunning = false;
  let recvStartTime = 0;
  let recvEndTime = 0;
  let recvExpected = 0;
  let recvActual = 0;

  function parseMessageBody(body) {
    if (typeof body !== 'string') return body;
    if (body.length === 0) return '';
    try {
      return JSON.parse(body);
    } catch (_) {
      return body;
    }
  }

  // ========== 日志池（DOM 复用，避免频繁创建/销毁） ==========
  const MAX_LOG_ITEMS = 100;
  const logPool = [];
  let logIndex = 0;
  let logCount = 0;

  // 预分配所有日志 DOM 节点
  for (let i = 0; i < MAX_LOG_ITEMS; i++) {
    const div = document.createElement('div');
    div.className = 'log-item info';
    div.style.display = 'none';
    ueLogArea.appendChild(div);
    logPool.push(div);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  function updateLogItem(div, type, fn, msg) {
    div.className = 'log-item ' + type;

    const now = new Date();
    const ts = now.toLocaleTimeString('zh-CN', { hour12: false }) + '.' +
               String(now.getMilliseconds()).padStart(3, '0');

    let bodyPreview = '';
    if (msg) {
      const s = typeof msg === 'string' ? msg : JSON.stringify(msg);
      bodyPreview = s.length > 50 ? s.substring(0, 50) + '...' : s;
    }

    div.innerHTML = '<span class="fn">' + escapeHtml(fn) + '</span> ' +
                    escapeHtml(bodyPreview) +
                    '<span class="ts">' + ts + '</span>';
    div.style.display = '';
  }

  function addUeLog(fn, msg) {
    const div = logPool[logIndex];
    updateLogItem(div, 'recv', fn, msg);
    // 倒序：最新日志插入到顶部
    ueLogArea.insertBefore(div, ueLogArea.firstChild);

    logIndex = (logIndex + 1) % MAX_LOG_ITEMS;
    if (logCount < MAX_LOG_ITEMS) logCount++;

    ueLogArea.scrollTop = 0;
  }

  function clearUeLog() {
    for (let i = 0; i < MAX_LOG_ITEMS; i++) {
      logPool[i].style.display = 'none';
    }
    logIndex = 0;
    logCount = 0;
  }

  // 初始化：第一条占位消息
  updateLogItem(logPool[0], 'info', '等待 UE 发来消息...', '');
  logCount = 1;
  logIndex = 1;

  // ========== 统计更新 ==========
  function updateStats() {
    cardSent.querySelector('.stat-value').textContent = totalReceived;
    const elapsed = sendEndTime ? (sendEndTime - sendStartTime) : 0;
    cardElapsed.querySelector('.stat-value').textContent = elapsed.toFixed(1) + 'ms';

    if (elapsed > 0 && totalReceived > 0) {
      const rate = (totalReceived / (elapsed / 1000)).toFixed(0);
      cardRate.querySelector('.stat-value').textContent = rate;
    } else {
      cardRate.querySelector('.stat-value').textContent = '0';
    }

    if (sending) {
      cardElapsed.className = 'stat-card running';
      cardSent.className  = 'stat-card running';
      cardRate.className  = 'stat-card running';
    } else if (sendEndTime) {
      cardElapsed.className = 'stat-card done';
      cardSent.className  = 'stat-card done';
      cardRate.className  = 'stat-card done';
    } else {
      cardElapsed.className = 'stat-card';
      cardSent.className  = 'stat-card';
      cardRate.className  = 'stat-card';
    }
  }

  function updateProgress(current, total) {
    const pct = total > 0 ? (current / total * 100) : 0;
    progressFill.style.width = pct + '%';
    if (current >= total && total > 0) {
      progressText.textContent = 'Done — ' + total + ' messages';
    } else if (sending) {
      progressText.textContent = 'Sending... ' + current + ' / ' + total;
    } else {
      progressText.textContent = 'Ready';
    }
  }

  // ========== 发送 ==========
  function buildMessageBody(index) {
    const raw = msgBodyEl.value.trim();
    if (!raw) return '{}';

    try {
      const obj = JSON.parse(raw);
      obj.index = index;
      obj.timestamp = Date.now();
      return obj;
    } catch (_) {
      return raw + ' #' + index;
    }
  }

  function doSend() {
    if (sending) return;
    if (!window.WebNative || !window.WebNative.send) {
      return;
    }

    const fnName = fnNameEl.value.trim() || 'PerfTest';
    const count = parseInt(sendCountEl.value, 10) || 1000;
    if (count < 1) return;

    sending = true;
    totalToSend = count;
    totalReceived = 0;
    sendStartTime = performance.now();

    btnSend.disabled = true;
    btnSend.textContent = 'Sending...';
    updateProgress(0, count);
    updateStats();

    // 1. 先发送开始信号，告诉 UE 条数
    window.WebNative.send('JsTestStart', { count: count, startTime: Date.now() });

    // 2. 发送所有消息
    for (let i = 0; i < count; i++) {
      window.WebNative.send(fnName, buildMessageBody(i));
    }

    // 3. 发送完成，等待 UE 回复 JsTestDone
    updateProgress(count, count);
    btnSend.textContent = 'Waiting for UE...';
  }

  function onSendComplete() {
    sending = false;
    btnSend.disabled = false;
    btnSend.textContent = 'Send to UE';
    updateProgress(totalReceived, totalToSend);
    updateStats();

    sendEndTime = 0;
  }

  // ========== 右侧：UE → JS 接收 ==========
  function updateRecvStats() {
    cardRecvCount.querySelector('.stat-value').textContent = recvActual;
    const elapsed = recvEndTime ? (recvEndTime - recvStartTime) : (recvRunning ? performance.now() - recvStartTime : 0);
    cardRecvElapsed.querySelector('.stat-value').textContent = elapsed.toFixed(1) + 'ms';

    if (elapsed > 0 && recvActual > 0) {
      const rate = (recvActual / (elapsed / 1000)).toFixed(0);
      cardRecvRate.querySelector('.stat-value').textContent = rate;
    } else {
      cardRecvRate.querySelector('.stat-value').textContent = '0';
    }

    if (recvRunning) {
      cardRecvElapsed.className = 'stat-card green running';
      cardRecvCount.className   = 'stat-card green running';
      cardRecvRate.className    = 'stat-card green running';
    } else if (recvEndTime) {
      cardRecvElapsed.className = 'stat-card green done';
      cardRecvCount.className   = 'stat-card green done';
      cardRecvRate.className    = 'stat-card green done';
    } else {
      cardRecvElapsed.className = 'stat-card green';
      cardRecvCount.className   = 'stat-card green';
      cardRecvRate.className    = 'stat-card green';
    }
  }

  function startReceiving() {
    if (recvRunning) return;
    if (!window.WebNative || !window.WebNative.send) return;

    const fnName = recvFnNameEl.value.trim() || 'UeTestMsg';
    const count = parseInt(recvCountEl.value, 10) || 1000;
    if (count < 1) return;

    let bodyTemplate = {};
    try {
      const raw = recvMsgBodyEl.value.trim();
      if (raw) bodyTemplate = JSON.parse(raw);
    } catch (_) { /* use empty object */ }

    recvRunning = true;
    recvExpected = count;
    recvActual = 0;
    recvEndTime = 0;
    recvStartTime = performance.now();

    btnRecv.disabled = true;
    btnRecv.textContent = 'Waiting for UE...';
    updateRecvStats();

    // Tell UE to start sending messages back to JS
    window.WebNative.send('UeTestStart', {
      functionName: fnName,
      body: bodyTemplate,
      count: count,
      startTime: Date.now()
    });
    // console.log('[UE→JS] Sent UeTestStart to UE: ...');
  }

  function onRecvComplete() {
    recvRunning = false;
    btnRecv.disabled = false;
    btnRecv.textContent = 'Send to JS';
    updateRecvStats();

    recvEndTime = 0;
  }

  // ========== 监听 UE 消息 ==========
  // 方式一：on() 按函数名订阅 — 等待 UE 回复 JsTestDone
  if (window.WebNative && window.WebNative.on) {
    window.WebNative.on('JsTestDone', function(body) {
      if (!sending) {
        addUeLog('JsTestDone', body);
        return;
      }
      const data = parseMessageBody(body);
      totalReceived = (data && data.count) ? data.count : totalToSend;
      sendEndTime = performance.now();
      onSendComplete();
    });

    // UE → JS: 接收过程中只累计计数，结束时统一更新 DOM，
    // 避免高吞吐测试被频繁的 textContent/className 更新干扰。
    window.WebNative.on('UeTestMsg', function(body) {
      if (recvRunning) {
        recvActual++;
      }
    });

    // UE → JS: Receive test complete
    window.WebNative.on('UeTestDone', function(body) {
      if (recvRunning) {
        const data = parseMessageBody(body);
        if (data && data.count) recvActual = data.count;
        recvEndTime = performance.now();
        addUeLog('UeTestDone', body);
        onRecvComplete();
      } else {
        addUeLog('UeTestDone', body);
      }
    });
  }


  // ========== 按钮事件 ==========
  btnSend.addEventListener('click', doSend);
  btnRecv.addEventListener('click', startReceiving);

  btnClearUe.addEventListener('click', function() {
    clearUeLog();
    updateLogItem(logPool[0], 'info', '等待 UE 发来消息...', '');
    logCount = 1;
    logIndex = 1;
  });

})();
</script>

</body>
</html>
