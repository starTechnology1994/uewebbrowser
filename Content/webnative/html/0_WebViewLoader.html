﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebView Loader</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:#c9d1d9;background:#0d1117;user-select:none;-webkit-user-select:none;}
body{display:flex;flex-direction:column;}
input,textarea{user-select:text;-webkit-user-select:text;}

/* 顶部栏 */
.top-bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 20px;background:#161b22;border-bottom:1px solid #21262d;}
.top-bar h1{font-size:16px;color:#58a6ff;white-space:nowrap;}
.top-bar .url-wrap{flex:1;display:flex;gap:6px;}
.top-bar input{flex:1;padding:7px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px;font-family:"SF Mono",Consolas,monospace;outline:none;}
.top-bar input:focus{border-color:#58a6ff;}
.top-bar input::placeholder{color:#30363d;}
.top-bar .btn{padding:7px 18px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .15s;}
.top-bar .btn:hover{background:#30363d;}
.top-bar .btn.primary{background:#238636;border-color:#238636;color:#fff;}
.top-bar .btn.primary:hover{background:#2ea043;}

/* 占位区 */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#30363d;}
.hero .icon{font-size:80px;margin-bottom:20px;}
.hero .text{font-size:18px;margin-bottom:8px;}
.hero .sub{font-size:13px;color:#21262d;}
.hero .hint{font-size:12px;color:#21262d;margin-top:30px;}
.hero .hint code{color:#484f58;background:#161b22;padding:2px 6px;border-radius:3px;}
</style>
</head>
<body>

<div class="top-bar">
  <h1>WebView Loader</h1>
  <div class="url-wrap">
    <input type="text" id="urlInput" placeholder="Enter URL (e.g. https://www.bilibili.com)" autocomplete="off">
    <button class="btn primary" id="btnLoad">Go</button>
    <button class="btn" id="btnReset">Reset</button>
  </div>
</div>

<div class="hero">
  <div class="icon">🌐</div>
  <div class="text">Enter a URL and click "Go" to navigate</div>
  <div class="sub">No iframe — navigates the WebView directly, IME works natively</div>
  <div class="hint">Press <code>Enter</code> to go · Use UE back button to return</div>
</div>

<script>
(function(){
  var DEFAULT_URL = 'https://www.bilibili.com/video/BV1R1e4zKEh1';
  var urlInput = document.getElementById('urlInput');
  var btnLoad = document.getElementById('btnLoad');
  var btnReset = document.getElementById('btnReset');

  function ensureProtocol(url) {
    var u = url.trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^\/\//.test(u)) return 'https:' + u;
    return 'https://' + u;
  }

  function loadUrl(raw) {
    var url = ensureProtocol(raw);
    if (!url) return;
    // 不使用 iframe，直接导航 WebView 到目标 URL
    // 中文 IME、键盘焦点等都由 CEF 原生处理，无跨域限制
    window.location.href = url;
  }

  btnLoad.addEventListener('click', function() {
    var u = urlInput.value.trim();
    if (!u) { loadUrl(DEFAULT_URL); return; }
    loadUrl(u);
  });

  btnReset.addEventListener('click', function() {
    urlInput.value = '';
    urlInput.focus();
  });

  urlInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') btnLoad.click();
  });

  urlInput.focus();
  urlInput.value = DEFAULT_URL;

  // UE 通信
  if (window.WebNative && window.WebNative.on) {
    window.WebNative.on('Navigate', function(body) {
      var data = typeof body === 'string' ? JSON.parse(body) : body;
      if (data && data.url) loadUrl(data.url);
    });
  }
  if (window.WebNative && window.WebNative.send)
    window.WebNative.send('WebViewLoaderReady', '{}');

  window.loadUrl = loadUrl;
})();
</script>
</body>
</html>
