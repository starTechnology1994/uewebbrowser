<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Globe GIS</title>
<script src="assets/globe.gl.min.js" onerror="showLoadError('globe.gl','local')"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;color:#e8ecf1;background:#0d1117;overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;}
input,textarea{user-select:text;-webkit-user-select:text;}
.cdn-error{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.cdn-error.show{display:flex;}
.cdn-error .err-icon{font-size:48px;}
.cdn-error .err-title{font-size:20px;font-weight:700;color:#f85149;}
.cdn-error .err-detail{font-size:13px;color:#8b949e;text-align:center;line-height:1.8;}
.cdn-error .err-detail code{background:#21262d;padding:2px 8px;border-radius:4px;color:#f0883e;}
.title-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#161b22;border-bottom:1px solid #21262d;z-index:10;}
.title-bar h1{font-size:16px;color:#58a6ff;}
.title-bar .controls{display:flex;gap:8px;}
.title-bar .btn{padding:5px 14px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.title-bar .btn:hover{background:#30363d;border-color:#58a6ff;}
.title-bar .btn.active{background:#238636;border-color:#238636;color:#fff;}
.title-bar .time{font-size:13px;color:#8b949e;font-family:"SF Mono",Consolas,monospace;}
#globe-container{position:relative;flex:1;overflow:hidden;}
#globe{width:100%;height:100%;}
.info-panel{position:absolute;bottom:16px;left:16px;z-index:10;background:rgba(22,27,34,0.88);backdrop-filter:blur(12px);border:1px solid #30363d;border-radius:10px;padding:14px 18px;min-width:240px;pointer-events:none;}
.info-panel .ip-title{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.info-panel .ip-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;}
.info-panel .ip-label{color:#8b949e;}
.info-panel .ip-value{color:#58a6ff;font-weight:600;font-family:"SF Mono",Consolas,monospace;}
.info-panel .ip-value.green{color:#3fb950;}
.info-panel .ip-value.orange{color:#f0883e;}
.info-panel .ip-value.red{color:#f85149;}
.status-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 20px;background:#161b22;border-top:1px solid #21262d;font-size:11px;color:#484f58;}
.status-bar .sb-left{display:flex;gap:20px;}
.status-bar .sb-item{display:flex;align-items:center;gap:6px;}
.status-bar .sb-dot{width:8px;height:8px;border-radius:50%;}
.status-bar .sb-dot.green{background:#3fb950;}
.status-bar .sb-dot.blue{background:#58a6ff;}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#8b949e;font-size:14px;z-index:20;}
</style>
</head>
<body>

<div class="cdn-error" id="cdnError">
  <div class="err-icon">📡</div>
  <div class="err-title">资源加载失败</div>
  <div class="err-detail">无法加载 <code id="errLib">globe.gl</code> 库<br><br>请检查网络连接是否正常<br>若处于离线环境，需将 CDN 库本地化</div>
</div>

<div class="title-bar">
  <h1>3D Globe GIS Monitor</h1>
  <div class="controls">
    <button class="btn active" id="btnRotate">Auto Rotate</button>
    <button class="btn" id="btnReset">Reset View</button>
  </div>
  <span class="time" id="clock">--</span>
</div>

<div id="globe-container">
  <div id="globe"></div>
  <div class="loading" id="loading">Loading globe...</div>
  <div class="info-panel">
    <div class="ip-title">Global Monitor</div>
    <div class="ip-row"><span class="ip-label">Active Stations</span><span class="ip-value" id="statStations">50</span></div>
    <div class="ip-row"><span class="ip-label">Online</span><span class="ip-value green" id="statOnline">42</span></div>
    <div class="ip-row"><span class="ip-label">Warnings</span><span class="ip-value orange" id="statWarnings">6</span></div>
    <div class="ip-row"><span class="ip-label">Critical</span><span class="ip-value red" id="statCritical">2</span></div>
    <div class="ip-row"><span class="ip-label">Data Throughput</span><span class="ip-value" id="statThroughput">8.4 GB/s</span></div>
  </div>
</div>

<div class="status-bar">
  <div class="sb-left">
    <div class="sb-item"><div class="sb-dot green"></div>System Online</div>
    <div class="sb-item"><div class="sb-dot blue"></div>Real-time Sync</div>
    <div class="sb-item">FPS: <span id="fps">60</span></div>
  </div>
  <div>WebNative Browser · 3D Globe GIS · Globe.gl</div>
</div>

<script>
window.showLoadError=function(l,s){document.getElementById('errLib').textContent=l+' ('+s+')';document.getElementById('cdnError').classList.add('show');};
setTimeout(function(){if(typeof Globe==='undefined')showLoadError('globe.gl','CDN');},5000);
(function(){
var autoRotate=true,world=null;
var stations=[{lat:39.9,lng:116.4,name:'Beijing',status:'normal'},{lat:31.2,lng:121.5,name:'Shanghai',status:'normal'},{lat:22.3,lng:114.2,name:'Shenzhen',status:'normal'},{lat:23.1,lng:113.3,name:'Guangzhou',status:'warning'},{lat:30.6,lng:104.1,name:'Chengdu',status:'normal'},{lat:29.6,lng:106.5,name:'Chongqing',status:'normal'},{lat:34.3,lng:108.9,name:"Xi'an",status:'normal'},{lat:43.8,lng:87.6,name:'Urumqi',status:'critical'},{lat:29.7,lng:91.1,name:'Lhasa',status:'normal'},{lat:45.7,lng:126.6,name:'Harbin',status:'normal'},{lat:41.8,lng:123.4,name:'Shenyang',status:'warning'},{lat:37.9,lng:112.5,name:'Taiyuan',status:'normal'},{lat:34.7,lng:113.6,name:'Zhengzhou',status:'normal'},{lat:30.5,lng:114.3,name:'Wuhan',status:'normal'},{lat:28.2,lng:112.9,name:'Changsha',status:'normal'},{lat:23.1,lng:113.3,name:'Foshan',status:'normal'},{lat:22.5,lng:113.9,name:'Zhuhai',status:'normal'},{lat:25,lng:102.7,name:'Kunming',status:'warning'},{lat:26.6,lng:106.7,name:'Guiyang',status:'normal'},{lat:36.1,lng:120.4,name:'Qingdao',status:'normal'},{lat:35.7,lng:139.7,name:'Tokyo',status:'normal'},{lat:37.6,lng:127,name:'Seoul',status:'normal'},{lat:1.4,lng:103.8,name:'Singapore',status:'normal'},{lat:13.7,lng:100.5,name:'Bangkok',status:'warning'},{lat:-33.9,lng:151.2,name:'Sydney',status:'normal'},{lat:51.5,lng:-0.1,name:'London',status:'normal'},{lat:48.9,lng:2.3,name:'Paris',status:'normal'},{lat:52.5,lng:13.4,name:'Berlin',status:'normal'},{lat:41.9,lng:12.5,name:'Rome',status:'normal'},{lat:40.4,lng:-3.7,name:'Madrid',status:'normal'},{lat:55.7,lng:37.6,name:'Moscow',status:'critical'},{lat:59.3,lng:18.1,name:'Stockholm',status:'normal'},{lat:60.2,lng:24.9,name:'Helsinki',status:'normal'},{lat:40.7,lng:-74,name:'New York',status:'normal'},{lat:34,lng:-118.2,name:'Los Angeles',status:'normal'},{lat:41.9,lng:-87.6,name:'Chicago',status:'normal'},{lat:29.8,lng:-95.4,name:'Houston',status:'warning'},{lat:47.6,lng:-122.3,name:'Seattle',status:'normal'},{lat:25.8,lng:-80.2,name:'Miami',status:'normal'},{lat:19.4,lng:-99.1,name:'Mexico City',status:'normal'},{lat:-23.5,lng:-46.6,name:'Sao Paulo',status:'normal'},{lat:-34.6,lng:-58.4,name:'Buenos Aires',status:'normal'},{lat:43.7,lng:-79.4,name:'Toronto',status:'normal'},{lat:28.6,lng:77.2,name:'New Delhi',status:'normal'},{lat:19.1,lng:72.9,name:'Mumbai',status:'warning'},{lat:13.1,lng:80.3,name:'Chennai',status:'normal'},{lat:25.3,lng:55.3,name:'Dubai',status:'normal'},{lat:30,lng:31.2,name:'Cairo',status:'normal'},{lat:-1.3,lng:36.8,name:'Nairobi',status:'normal'},{lat:-26.2,lng:28,name:'Johannesburg',status:'normal'},{lat:-33.9,lng:18.4,name:'Cape Town',status:'normal'}];
function statusColor(s){if(s==='critical')return'#f85149';if(s==='warning')return'#f0883e';return'#3fb950';}
var arcsData=[{startLat:39.9,startLng:116.4,endLat:31.2,endLng:121.5},{startLat:31.2,startLng:121.5,endLat:35.7,endLng:139.7},{startLat:35.7,startLng:139.7,endLat:40.7,endLng:-74},{startLat:40.7,startLng:-74,endLat:51.5,endLng:-0.1},{startLat:51.5,startLng:-0.1,endLat:55.7,endLng:37.6},{startLat:39.9,startLng:116.4,endLat:28.6,endLng:77.2},{startLat:31.2,startLng:121.5,endLat:1.4,endLng:103.8},{startLat:1.4,startLng:103.8,endLat:-33.9,endLng:151.2},{startLat:40.7,startLng:-74,endLat:34,endLng:-118.2},{startLat:48.9,startLng:2.3,endLat:55.7,endLng:37.6},{startLat:39.9,startLng:116.4,endLat:43.8,endLng:87.6},{startLat:25.3,startLng:55.3,endLat:19.1,endLng:72.9}];
var pointsData=stations.map(function(s){return{lat:s.lat,lng:s.lng,name:s.name,status:s.status,color:statusColor(s.status),size:s.status==='critical'?0.6:s.status==='warning'?0.45:0.35};});
function initGlobe(){document.getElementById('loading').style.display='none';var el=document.getElementById('globe');world=new Globe(el).globeImageUrl('assets/earth-night.jpg').bumpImageUrl('assets/earth-topology.png').backgroundImageUrl('assets/night-sky.png').showAtmosphere(true).atmosphereColor('#58a6ff').atmosphereAltitude(0.15).pointsData(pointsData).pointAltitude(0.01).pointColor('color').pointRadius(0.25).pointLabel(function(d){return'<div style="background:rgba(22,27,34,0.95);border:1px solid #58a6ff;border-radius:8px;padding:10px 14px;font-family:sans-serif;"><div style="font-size:14px;font-weight:600;color:#58a6ff;margin-bottom:4px;">'+d.name+'</div><div style="font-size:11px;color:#8b949e;">Lat: <span style="color:#c9d1d9;">'+d.lat.toFixed(2)+'</span></div><div style="font-size:11px;color:#8b949e;">Lng: <span style="color:#c9d1d9;">'+d.lng.toFixed(2)+'</span></div><div style="font-size:11px;color:#8b949e;">Status: <span style="color:'+d.color+';">'+d.status.toUpperCase()+'</span></div></div>';}).onPointClick(function(d){if(window.WebNative&&window.WebNative.send){window.WebNative.send('GlobeStationClick',{name:d.name,lat:d.lat,lng:d.lng,action:'station_click'});}}).arcsData(arcsData).arcColor(function(){return'rgba(88,166,255,0.6)';}).arcDashLength(0.5).arcDashGap(0.2).arcDashAnimateTime(2000).arcStroke(0.3).arcAltitudeAutoScale(0.4).ringsData([]);world.controls().autoRotate=autoRotate;world.controls().autoRotateSpeed=0.5;world.controls().enableZoom=true;world.controls().minDistance=150;world.controls().maxDistance=500;el.addEventListener('contextmenu',function(e){e.preventDefault();});}
document.getElementById('btnRotate').addEventListener('click',function(){autoRotate=!autoRotate;this.classList.toggle('active',autoRotate);this.textContent=autoRotate?'Auto Rotate':'Rotate Off';if(world)world.controls().autoRotate=autoRotate;});
document.getElementById('btnReset').addEventListener('click',function(){if(world)world.pointOfView({lat:20,lng:0,altitude:2.5},1000);});
(function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN');})();setInterval(function(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN');},1000);
setInterval(function(){document.getElementById('statOnline').textContent=38+Math.floor(Math.random()*8);document.getElementById('statWarnings').textContent=4+Math.floor(Math.random()*4);document.getElementById('statCritical').textContent=1+Math.floor(Math.random()*2);document.getElementById('statThroughput').textContent=(7.5+Math.random()*2).toFixed(1)+' GB/s';},3000);
var lastTime=performance.now(),frames=0;function fpsTick(){frames++;var n=performance.now();if(n-lastTime>=1000){document.getElementById('fps').textContent=frames;frames=0;lastTime=n;}requestAnimationFrame(fpsTick);}fpsTick();
initGlobe();
if(window.WebNative&&window.WebNative.send)window.WebNative.send('GlobeReady','{}');
})();
</script>
</body>
</html>
