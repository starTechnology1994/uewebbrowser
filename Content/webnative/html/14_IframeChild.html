<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Child</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:12px;color:#e8ecf1;background:#161b22;
  padding:16px;
}
h3{font-size:13px;margin-bottom:8px;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:10px;}
.badge.green{background:rgba(63,185,80,0.15);color:#3fb950;}
.badge.red{background:rgba(248,81,73,0.15);color:#f85149;}
.badge.blue{background:rgba(88,166,255,0.15);color:#58a6ff;}

button{
  padding:5px 14px;border:1px solid #30363d;border-radius:6px;
  background:#21262d;color:#c9d1d9;font-size:11px;font-family:inherit;
  cursor:pointer;margin-right:6px;margin-bottom:8px;
}
button:hover{background:#30363d;}

.status{padding:6px 10px;border-radius:4px;font-size:10px;margin-bottom:8px;background:#0d1117;border:1px solid #21262d;}
.status.ok{border-color:rgba(63,185,80,0.3);color:#3fb950;}
.status.err{border-color:rgba(248,81,73,0.3);color:#f85149;}
</style>
</head>
<body>

<h3>Iframe Child</h3>
<div class="badge" id="badge"></div>
<div class="status" id="status"></div>

<!-- 发送 -->
<div>
  <button onclick="send('FromIframe', {msg:'hello from iframe'})">Iframe → UE</button>
  <button onclick="send('RequestFromUE', {msg:'echo back to me'})">UE → Iframe</button>
</div>

<!-- 接收 -->
<div style="font-size:10px;color:#8b949e;margin-bottom:6px;">
  From UE: <span id="fromUE" style="color:#58a6ff;">--</span>
</div>

<script>
(function(){
  var hash = window.location.hash;
  var mode = hash.indexOf('postmessage')!==-1 ? 'postmessage' : 'sameorigin';
  var badge = document.getElementById('badge');
  var status = document.getElementById('status');

  if (mode === 'sameorigin') {
    badge.className = 'badge green';
    badge.textContent = 'Same-Origin';
    status.className = 'status ok';
    status.textContent = 'Using postMessage bridge';
  } else {
    badge.className = 'badge blue';
    badge.textContent = 'PostMessage Bridge';
    status.className = 'status ok';
    status.textContent = 'Using postMessage bridge';
  }

  // 统一走 postMessage，父页面做桥接
  window.send = function(name, data) {
    var body = JSON.stringify(data);
    window.parent.postMessage({ action:'toUE', name:name, body:body }, '*');
  };

  // UE → JS 监听 postMessage 事件
  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d || d.action !== 'fromUE') return;
    document.getElementById('fromUE').textContent = (typeof d.body === 'string' ? d.body : JSON.stringify(d.body)).slice(0,60);
  });
})();
</script>
</body>
</html>
