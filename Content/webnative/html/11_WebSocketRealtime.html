<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSocket Realtime</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;color:#e8ecf1;background:#0d1117;overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;}
input,textarea{user-select:text;-webkit-user-select:text;}
.title-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#161b22;border-bottom:1px solid #21262d;}
.title-bar h1{font-size:15px;color:#58a6ff;}
.conn-status{display:flex;align-items:center;gap:6px;font-size:11px;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#f85149;}
.conn-dot.connected{background:#3fb950;}
.conn-dot.connecting{background:#f0883e;animation:pulse 0.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.control-row{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 20px;background:#161b22;border-bottom:1px solid #21262d;}
.control-row .input{padding:6px 12px;background:#0d1117;border:1px solid #30363d;border-radius:5px;color:#e8ecf1;font-size:12px;font-family:"SF Mono",Consolas,monospace;outline:none;flex:1;}
.control-row .input:focus{border-color:#58a6ff;}
.control-row .ws-url{flex:2;}
.control-row .btn{padding:6px 16px;border:1px solid #30363d;border-radius:5px;background:#21262d;color:#8b949e;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.control-row .btn:hover{background:#30363d;color:#e8ecf1;}
.control-row .btn-connect{background:#1f3a5f;border-color:#58a6ff;color:#58a6ff;}
.control-row .btn-disconnect{background:#3f1a1a;border-color:#f85149;color:#f85149;}
.control-row .btn-send{background:#1a3a1f;border-color:#3fb950;color:#3fb950;}

.main-area{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#21262d;}
.panel{background:#161b22;display:flex;flex-direction:column;overflow:hidden;}
.panel-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;border-bottom:1px solid #21262d;}
.panel-header .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8b949e;}
.panel-header .count{font-size:10px;color:#58a6ff;}
.messages{flex:1;overflow-y:auto;padding:6px;}
.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px;}

.msg{padding:3px 6px;border-radius:3px;margin-bottom:2px;font-family:"SF Mono",Consolas,monospace;font-size:10px;word-break:break-all;}
.msg .ts{color:#484f58;min-width:65px;display:inline-block;}
.msg.sent{color:#58a6ff;}
.msg.recv{color:#3fb950;}
.msg.sys{color:#8b949e;}
.msg.err{color:#f85149;}
</style>
</head>
<body>

<div class="title-bar">
  <h1>WebSocket Realtime Communication</h1>
  <div class="conn-status">
    <span class="conn-dot" id="dot"></span>
    <span id="connLabel">Disconnected</span>
  </div>
</div>
<div class="control-row">
  <input class="input ws-url" id="wsUrl" value="wss://echo.websocket.org" placeholder="WebSocket URL (wss://echo.websocket.org)">
  <button class="btn btn-connect" id="btnConnect">Connect</button>
  <button class="btn btn-disconnect" id="btnDisconnect" style="display:none;">Disconnect</button>
  <input class="input" id="msgInput" style="flex:1;" placeholder="Type message...">
  <button class="btn btn-send" id="btnSend" disabled>Send</button>
  <button class="btn" id="btnSimulate">Simulate</button>
</div>
<div class="main-area">
  <div class="panel">
    <div class="panel-header"><span class="label">Sent Messages</span><span class="count" id="sentCount">0</span></div>
    <div class="messages" id="sentMsgs"><div class="msg sys"><span class="ts">--:--:--</span>Waiting for connection...</div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><span class="label">Received Messages</span><span class="count" id="recvCount">0</span></div>
    <div class="messages" id="recvMsgs"><div class="msg sys"><span class="ts">--:--:--</span>Waiting for connection...</div></div>
  </div>
</div>
<script>
(function(){
  var ws=null,connected=false,sentCount=0,recvCount=0;
  var dot=document.getElementById('dot'),connLabel=document.getElementById('connLabel');
  var wsUrl=document.getElementById('wsUrl'),msgInput=document.getElementById('msgInput');
  var btnConnect=document.getElementById('btnConnect'),btnDisconnect=document.getElementById('btnDisconnect');
  var btnSend=document.getElementById('btnSend'),btnSimulate=document.getElementById('btnSimulate');
  var sentMsgs=document.getElementById('sentMsgs'),recvMsgs=document.getElementById('recvMsgs');
  var sentCountEl=document.getElementById('sentCount'),recvCountEl=document.getElementById('recvCount');

  function ts(){var d=new Date();return d.toLocaleTimeString('zh-CN',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0');}

  function addMsg(container,type,text){
    var d=document.createElement('div');d.className='msg '+type;
    d.innerHTML='<span class="ts">'+ts()+'</span>'+text;
    container.appendChild(d);
    container.scrollTop=container.scrollHeight;
    while(container.children.length>200)container.removeChild(container.firstChild);
  }

  function setConnected(val){
    connected=val;
    dot.className=val?'conn-dot connected':(val===null?'conn-dot connecting':'conn-dot');
    connLabel.textContent=val?'Connected':(val===null?'Connecting...':'Disconnected');
    btnConnect.style.display=val?'none':'inline-block';
    btnDisconnect.style.display=val?'inline-block':'none';
    btnSend.disabled=!val;
    if(!val&&val!==null){ws=null;}
  }

  btnConnect.addEventListener('click',function(){
    var url=wsUrl.value.trim();
    if(!url)return;
    if(ws){ws.close();ws=null;}
    setConnected(null);
    sentMsgs.innerHTML='';recvMsgs.innerHTML='';
    sentCount=0;recvCount=0;sentCountEl.textContent='0';recvCountEl.textContent='0';
    try{
      ws=new WebSocket(url);
      ws.onopen=function(){setConnected(true);addMsg(recvMsgs,'sys','Connected to '+url);};
      ws.onmessage=function(e){recvCount++;recvCountEl.textContent=recvCount;addMsg(recvMsgs,'recv',e.data);};
      ws.onerror=function(){addMsg(recvMsgs,'err','Connection error');};
      ws.onclose=function(){if(connected!==false){setConnected(false);addMsg(recvMsgs,'sys','Disconnected');}};
    }catch(err){setConnected(false);addMsg(recvMsgs,'err','Failed: '+err.message);}
  });

  btnDisconnect.addEventListener('click',function(){if(ws){ws.close();ws=null;}setConnected(false);});

  btnSend.addEventListener('click',function(){
    if(!ws||!connected)return;
    var text=msgInput.value.trim();
    if(!text)return;
    ws.send(text);sentCount++;sentCountEl.textContent=sentCount;
    addMsg(sentMsgs,'sent',text);
    msgInput.value='';
  });

  msgInput.addEventListener('keydown',function(e){if(e.key==='Enter')btnSend.click();});

  // 模拟：生成模拟数据（无需真实 WebSocket）
  btnSimulate.addEventListener('click',function(){
    var d='{"device":"Station-'+(Math.floor(Math.random()*10)+1)+'","temp":'+(20+Math.random()*15).toFixed(1)+',"pressure":'+(100+Math.random()*5).toFixed(2)+',"status":"'+(Math.random()>0.2?'OK':'WARNING')+'"}';
    recvCount++;recvCountEl.textContent=recvCount;
    addMsg(recvMsgs,'recv',d);
  });

  // UE 通信
  if(window.WebNative&&window.WebNative.on){
    window.WebNative.on('WS_Send',function(body){
      var data=typeof body==='string'?JSON.parse(body):body;
      if(data.url)wsUrl.value=data.url;
      if(data.message&&ws&&connected){ws.send(data.message);sentCount++;sentCountEl.textContent=sentCount;addMsg(sentMsgs,'sent',data.message);}
      if(data.url&&!connected)btnConnect.click();
    });
  }
  if(window.WebNative&&window.WebNative.send)window.WebNative.send('WSDemoReady','{}');
  window.wsAPI={connect:function(u){wsUrl.value=u||wsUrl.value;btnConnect.click();},send:function(m){msgInput.value=m;btnSend.click();},simulate:function(){btnSimulate.click();}};

  // 快捷键屏蔽
  document.addEventListener('keydown',function(e){
    var blocked=false;
    if(e.ctrlKey||e.metaKey){var bk=['KeyT','KeyN','KeyW','KeyR','KeyF','KeyH','KeyJ','KeyO','KeyP','KeyS','KeyU','KeyD','KeyQ','KeyL'];if(bk.indexOf(e.code)!==-1)blocked=true;}
    if(e.altKey&&!e.ctrlKey)blocked=true;
    if(e.code==='F5'||e.code==='F11'||e.code==='F12')blocked=true;
    if(blocked){e.preventDefault();e.stopPropagation();}
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
})();
</script>
</body>
</html>
